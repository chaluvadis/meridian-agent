services:
  meridian-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production # Changed to Production for Coolify
      - ASPNETCORE_URLS=http://+:8080
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__RequestTimeoutSeconds=300
      - Ollama__EmbeddingModel=nomic-embed-text
      - Qdrant__Endpoint=http://qdrant:6333
      - Qdrant__CollectionPrefix=meridian
      - ConnectionStrings__Meridian=Data Source=/app/data/meridian.db
      - Weather__BaseUrl=https://api.openweathermap.org
      - Weather__ApiKey=${WEATHER_API_KEY:-}
      - Nominatim__BaseUrl=https://nominatim.openstreetmap.org
      # Routing and venue lookup are separate services so each can be swapped for a local one.
      - Osrm__BaseUrl=http://osrm:5000
      - Overpass__BaseUrl=http://overpass:80/api
      - Storage__DataDirectory=/app/samples
    volumes:
      - ./samples:/app/samples
      - meridian-data:/app/data # Persists SQLite DB
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      # Note: Ensure your Dockerfile installs 'curl' in the runtime stage, 
      # or change this to: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: meridian-ollama
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama # This is where models MUST be saved
    restart: unless-stopped

  # OSRM routing: driving minutes between two positions, rather than a distance somebody asserted.
  osrm:
    image: osrm/osrm-backend:latest
    container_name: meridian-osrm
    # The router needs an extract to work from, so the first start fetches the UAE region from
    # Geofabrik and builds the graph into the volume. Later starts reuse it and skip the download
    # and the extract. Point OSRM_REGION_URL at a smaller area if the graph is more than you need.
    environment:
      - OSRM_REGION_URL=https://download.geofabrik.de/asia/united-arab-emirates-latest.osm.pbf
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/region.osm.pbf ]; then
          echo 'Fetching the region extract for routing…';
          curl -sSL "$$OSRM_REGION_URL" -o /data/region.osm.pbf;
        fi
        osrm-extract -p /opt/car.lua /data/region.osm.pbf &&
        osrm-partition /data/region.osrm &&
        osrm-customize /data/region.osrm &&
        osrm-routed /data/region.osrm
    expose:
      - "5000"
    volumes:
      - osrm-data:/data
    restart: unless-stopped

  # Overpass: the venues that are actually around the traveler, straight from OpenStreetMap. It
  # answers the one query the app makes - places with a name within a radius - and nothing is
  # proxied through a public instance, so rate limits stop being somebody else's problem.
  overpass:
    image: wiktorn/overpass-api:latest
    container_name: meridian-overpass
    environment:
      # First start downloads the region and builds the database, which takes minutes rather than
      # seconds and needs internet. It happens once; the volume keeps it after that.
      - OVERPASS_MODE=init
      - OVERPASS_META=no
      - OVERPASS_PLANET_URL=https://download.geofabrik.de/asia/united-arab-emirates-latest.osm.pbf
    expose:
      - "80"
    volumes:
      - overpass-db:/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meridian-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  # Helper service to pre-pull models on first deployment
  ollama-models-puller:
    image: ollama/ollama:latest
    container_name: meridian-ollama-puller
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama-models:/root/.ollama # CRITICAL FIX: Must share the same volume as the main ollama service!
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Waiting for Ollama to be ready...';
        sleep 10; # Give the main ollama service time to fully boot
        echo 'Pulling models for The Meridian Agent…';
        ollama pull qwen2.5:1.5b &&
        ollama pull qwen2.5:3b &&
        ollama pull llama3.1:8b &&
        ollama pull nomic-embed-text;
        echo 'Model pull finished. This container will now exit.';
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no" # Runs once and exits

volumes:
  ollama-models:
  qdrant-data:
  meridian-data:
  # OSRM routing graph, extracted once from the region and reused.
  osrm-data:
  # Overpass database, built once from the region extract.
  overpass-db: