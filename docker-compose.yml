services:
  meridian-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      # The hosted model: the Kilo AI Gateway (https://kilo.ai/docs/gateway) with a Kilo key.
      # Set KILO_API_KEY in your .env (or in the Coolify environment panel). One OpenAI-compatible
      # endpoint, hundreds of models, no local model server and no 4GB of weights in RAM.
      - AI__ApiKey=${KILO_API_KEY:-}
      - AI__BaseUrl=${AI_BASE_URL:-https://api.kilo.ai/api/gateway}
      # Model knobs pass through from .env, so switching chat models really changes what runs.
      - AI__Model=${AI_MODEL:-anthropic/claude-sonnet-4.6}
      # Left empty by default: the gateway hosts chat models only, so there are no embeddings and the
      # safeguard reads the full rulebook. Point AI__EmbeddingModel (and QDRANT__VECTOR_SIZE) at an
      # embedding model to turn the Qdrant vector search back on.
      - AI__EmbeddingModel=${AI_EMBEDDING_MODEL:-}
      - AI__Temperature=${AI_TEMPERATURE:-0.2}
      - AI__MaxTokens=${AI_MAX_TOKENS:-2048}
      - AI__RequestTimeoutSeconds=${AI_REQUEST_TIMEOUT_SECONDS:-120}
      - AI__RetryCount=${AI_RETRY_COUNT:-2}
      - Qdrant__Endpoint=http://qdrant:6333
      - Qdrant__CollectionPrefix=meridian
      - Qdrant__VectorSize=${QDRANT_VECTOR_SIZE:-1536}
      - ConnectionStrings__Meridian=Data Source=/app/data/meridian.db
      - Weather__BaseUrl=https://api.openweathermap.org
      - Weather__ApiKey=${WEATHER_API_KEY:-}
      - Nominatim__BaseUrl=https://nominatim.openstreetmap.org
      - Osrm__BaseUrl=http://osrm:5000
      - Overpass__BaseUrl=http://overpass:80/api
      - Storage__DataDirectory=/app/samples
    volumes:
      - ./samples:/app/samples
      - meridian-data:/app/data
    depends_on:
      qdrant:
        condition: service_started
      # Note: We do NOT depend_on osrm/overpass here because they take 15-30 mins
      # to build on first run. Your C# code MUST handle their temporary unavailability gracefully.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s # Increased start period for .NET boot
      retries: 3
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend:latest
    container_name: meridian-osrm
    environment:
      - OSRM_REGION_URL=https://download.geofabrik.de/asia/united-arab-emirates-latest.osm.pbf
    command:
      - /bin/sh
      - -c
      - |
        if [ ! -f /data/region.osm.pbf ]; then
          echo 'Fetching UAE region extract for routing (this takes a few minutes)...';
          curl -sSL "$$OSRM_REGION_URL" -o /data/region.osm.pbf;
        fi
        echo 'Building OSRM routing graph (this is CPU/RAM intensive)...';
        osrm-extract -p /opt/car.lua /data/region.osm.pbf &&
        osrm-partition /data/region.osrm &&
        osrm-customize /data/region.osrm &&
        echo 'OSRM ready. Starting router...';
        osrm-routed --algorithm mld /data/region.osrm
    expose:
      - "5000"
    volumes:
      - osrm-data:/data
    restart: unless-stopped

  overpass:
    image: wiktorn/overpass-api:latest
    container_name: meridian-overpass
    environment:
      - OVERPASS_MODE=init
      - OVERPASS_META=no
      - OVERPASS_PLANET_URL=https://download.geofabrik.de/asia/united-arab-emirates-latest.osm.pbf
    expose:
      - "80"
    volumes:
      - overpass-db:/db
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meridian-qdrant
    # REMOVED 'ports' mapping. Coolify's internal network handles http://qdrant:6333 perfectly.
    # This prevents exposing your vector DB to the public internet.
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-data:
  meridian-data:
  osrm-data:
  overpass-db: