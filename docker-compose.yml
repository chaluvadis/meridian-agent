services:
  meridian-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridian-web
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Ollama__BaseUrl=http://ollama:11434
      - Ollama__RequestTimeoutSeconds=300
      - Ollama__EmbeddingModel=nomic-embed-text
      - Qdrant__Endpoint=http://qdrant:6333
      - Qdrant__CollectionPrefix=meridian
      - Weather__BaseUrl=https://api.openweathermap.org
      - Weather__ApiKey=${WEATHER_API_KEY:-}
      - Nominatim__BaseUrl=https://nominatim.openstreetmap.org
      - Osrm__BaseUrl=https://router.project-osrm.org
      - Storage__DataDirectory=/app/samples
    volumes:
      - ./samples:/app/samples
    depends_on:
      ollama:
        condition: service_started
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: meridian-ollama
    # Reached by meridian-web at http://ollama:11434 over the compose network only.
    # Not bound to the host: a locally installed Ollama almost always owns 11434 already
    # ("Bind for 0.0.0.0:11434 failed: port is already allocated"). To also reach this
    # container's Ollama from the host (e.g. the `ollama` CLI), uncomment the mapping
    # below and pick a free host port such as 11435.
    expose:
      - "11434"
    # ports:
    #   - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: meridian-qdrant
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  ollama-models:
    image: ollama/ollama:latest
    container_name: meridian-ollama-models
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo 'Pulling models for The Meridian Agent…';
        ollama pull qwen2.5:1.5b &&
        ollama pull qwen2.5:3b &&
        ollama pull llama3.1:8b &&
        ollama pull nomic-embed-text;
        echo 'Model pull finished.';
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

volumes:
  ollama-models:
  qdrant-data:
